<!-- 股價：把帳戶當成一家上市公司，股價＝每股淨值 -->
<div class="col span-8">
  <div class="card">
    <div class="card-head"><div id="sQuote" class="s-quote"></div><span id="sRange"></span></div>
    <div class="s-range-chg" id="sRangeChg"></div>
    <div class="chart-box s-chart" id="sChart"></div>
    <div class="note">沒有公開市場，股價就是每股淨值：總資產 ÷ 流通在外股數。開戶那天每股 $10；入金照當時的股價發行新股、出金照股價買回，所以入金出金不會讓股價變動，只有投資賺賠會。</div>
  </div>
</div>
<div class="col span-4">
  <div class="card">
    <div class="card-head"><h2>關鍵數據</h2></div>
    <div id="sStats"></div>
  </div>
</div>
<div class="col span-12">
  <div class="card">
    <div class="card-head"><h2>股本變動</h2><span class="card-note">入金是增資發行新股、出金是買回股票，價格用前一天收盤的股價</span></div>
    <div id="sShares"></div>
  </div>
</div>
