<!-- 總覽：今年的進度、持股、近期事件、進行中的計畫、總資產走勢 -->
<div class="col span-8 stretch">
  <div class="card" id="progressCard">
    <div class="card-head"><h2>今年的進度</h2><span class="card-note" id="progressNote"></span></div>
    <div class="fill-box" id="progressBox"></div>
  </div>
</div>
<div class="col span-4 stretch">
  <div class="tiles cols-2">
    <div class="tile outline"><div class="k">持倉市值</div><div class="v num" id="stStock">—</div><div class="s num" id="stStockSub"></div></div>
    <div class="tile outline"><div class="k">現金（美元）</div><div class="v num" id="stUSD">—</div><div class="s muted num" id="stUSDSub"></div></div>
    <div class="tile outline"><div class="k">USD / TWD 匯率</div><div class="v num" id="stFx">—</div><div class="s num" id="stFxSub"></div></div>
    <div class="tile outline"><div class="k">槓桿率</div><div class="v num" id="stLev">—</div><div class="s muted num" id="stLevSub"></div></div>
  </div>
</div>
<div class="col span-12">
  <div class="card">
    <div class="card-head"><h2>持股</h2><span class="card-note" id="syncInfo"></span></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>代號</th><th>股數</th><th>均價</th><th>現價</th><th>今日</th><th>市值 (USD)</th><th>佔比</th></tr></thead>
        <tbody id="holdingsBody"></tbody>
      </table>
    </div>
    <div class="note" id="optNote"></div>
  </div>
</div>
<div class="col span-8">
  <div class="card">
    <div class="card-head">
      <h2>總資產走勢 <span class="card-note" id="chartCurLabel"></span></h2>
      <span class="card-tools">
        <span class="seg" id="chartModeSeg"><button data-cmode="total">總資產</button><button data-cmode="principal">本金與獲利</button></span>
        <button class="ghost" id="rebuildBtn" title="用全部交易紀錄與歷史收盤價重新計算過去每天的總資產">↻ 重新計算</button>
        <span class="seg" id="rangeSeg"><button data-range="30">1月</button><button data-range="90">3月</button><button data-range="180">6月</button><button data-range="ytd">今年</button><button data-range="365">1年</button><button data-range="0">全部</button></span>
      </span>
    </div>
    <div class="legend" id="chartLegend"></div>
    <div class="chart-box tall" id="chartBox"></div>
    <div class="note">過去的走勢由交易紀錄與歷史收盤價推算，匯入券商檔案後會自動重新計算；今天的數字隨股價即時更新。</div>
  </div>
</div>
<div class="col span-4">
  <div class="card" id="planSumCard">
    <div class="card-head"><h2>進行中的交易計畫</h2><a class="card-link" href="/plans">寫新計畫 →</a></div>
    <div id="planSummary"></div>
  </div>
  <div class="card" id="eventsCard">
    <div class="card-head"><h2>近期事件</h2><span class="card-note">財報、配息、選擇權到期</span></div>
    <div id="eventsBox"></div>
  </div>
</div>
