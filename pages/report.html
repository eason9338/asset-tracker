<!-- 財報：把帳戶當成一家投資公司，照正式財報的科目編損益表 -->
<div class="col span-12">
  <div class="card">
    <div class="card-head"><h2>財報</h2><span id="rKind"></span></div>
    <div class="chips r-periods" id="rPeriods"></div>
    <div class="fs-head" id="rHead"></div>
    <div class="chart-box report-sankey" id="rSankey"></div>
  </div>
</div>
<div class="col span-12">
  <div class="card">
    <div class="card-head"><h2>營收與獲利</h2><span class="card-note" id="rTrendNote"></span></div>
    <div class="r-trend">
      <div><div class="kv-title">營業收入</div><div class="legend"></div><div class="chart-box r-chart" id="rRevChart"></div></div>
      <div><div class="kv-title">每股盈餘（EPS）</div><div class="legend" id="rEpsLegend"></div><div class="chart-box r-chart" id="rEpsChart"></div></div>
      <div><div class="kv-title">淨利率與營收成長率</div><div class="legend" id="rMarginLegend"></div><div class="chart-box r-chart" id="rMarginChart"></div></div>
    </div>
  </div>
</div>
<div class="col span-8">
  <div class="card">
    <div class="card-head"><h2>綜合損益表</h2><span class="card-note">單位：美元・括號是負數</span></div>
    <div id="rTable"></div>
  </div>
</div>
<div class="col span-4">
  <div class="card">
    <div class="card-head"><h2>本期重點</h2></div>
    <div id="rHighlights"></div>
  </div>
  <div class="card">
    <div class="card-head"><h2>財務比率</h2></div>
    <div id="rRatios"></div>
    <div class="note">還沒賣的部位照市價衡量（跟公司持有交易目的的股票一樣），期間內的漲跌列在「金融資產評價損益」。本期淨利＝期末淨資產 − 期初淨資產 − 期間的入金出金，跟「賺到的錢」對得起來。股數：開戶時每股 $10 發行，之後入金照當時的每股淨值增發、出金照每股淨值買回（跟基金的單位一樣），EPS＝淨利 ÷ 期間平均股數。處分利益是扣手續費前的金額，手續費另外列在營業費用；股利是稅後實收。季報跟去年同一季比；年報跟去年比，今年還沒結束就跟去年同一段期間比。</div>
  </div>
</div>
